name: Sync Upstream Branches

on:
  workflow_dispatch:  # Allows manual triggering
  schedule:
    # Run once a week on Monday at 00:00 UTC (optional - comment out if not wanted)
    - cron: '0 0 * * 1'

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push branches
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Add upstream remote
        run: |
          if ! git remote get-url upstream &>/dev/null; then
            git remote add upstream https://github.com/Easya-Solutions/dolibarr.git
          fi
          git remote set-url upstream https://github.com/Easya-Solutions/dolibarr.git
          
      - name: Fetch upstream branches
        run: |
          git fetch upstream --no-tags
          
      - name: Get list of branches to sync
        id: branches
        run: |
          UPSTREAM_BRANCHES=$(mktemp)
          ORIGIN_BRANCHES=$(mktemp)
          BRANCHES_TO_PUSH=$(mktemp)
          trap "rm -f '$UPSTREAM_BRANCHES' '$ORIGIN_BRANCHES' '$BRANCHES_TO_PUSH'" EXIT
          
          git branch -r | grep "upstream/" | sed 's|^[[:space:]]*upstream/||' | sort > "$UPSTREAM_BRANCHES"
          git branch -r | grep "origin/" | sed 's|^[[:space:]]*origin/||' | sort > "$ORIGIN_BRANCHES"
          comm -13 "$ORIGIN_BRANCHES" "$UPSTREAM_BRANCHES" > "$BRANCHES_TO_PUSH"
          
          TOTAL=$(wc -l < "$BRANCHES_TO_PUSH")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Found $TOTAL branches to sync"
          
      - name: Push branches in batches
        if: steps.branches.outputs.total > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./sync-upstream-branches.sh
          ./sync-upstream-branches.sh
          
      - name: Summary
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "Total branches synced: ${{ steps.branches.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sync completed successfully" >> $GITHUB_STEP_SUMMARY
